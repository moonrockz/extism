schema: html-design

context: |
  moonrockz/extism is an Extism host for MoonBit: a WASM engine layer, the Extism kernel written
  in Zig and compiled to one wasm32-freestanding module, a WASI preview 1 sandbox, and a plugin API.
  The engine and the plugin API support the native and js targets; the kernel and the WASI
  sandbox support all four targets. The library stays free of Morphir concepts;
  finos/morphir-moonbit is its first consumer. Process and file I/O stay in host adapters;
  domain logic is pure over explicit inputs and immutable public values. Work is tracked in the
  shared Morphir beads tracker with the label repo:extism; this repository has no beads database.
  Write all artifacts in ASD-STE100 Simplified Technical English.

rules:
  design:
    - Label maintainer decisions Owner and author decisions Call.
  tasks:
    - Group tasks into story-sized units. Each group names its beads issue ID once one exists.
  proposal:
    - State what is out of scope.

operations:
  archive:
    guidance:
      - >-
        Archiving moves the change one directory deeper, to
        openspec/changes/archive/<date>-<name>/. In its design.html, change each
        "../../../docs/templates/assets/" prefix to "../../../../docs/templates/assets/"
        so that the page still finds its styles and scripts.
      - >-
        Update the beads in the shared Morphir tracker: set the epic's spec id to the
        archived path, close the epic when every group bead is closed, then run
        `bd dolt push`.
