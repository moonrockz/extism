# Release: plan, checks, package, publish, GitHub release. Ported from moonrockz/moon-lander.
#
# plan      decides whether this run releases: the push of the tag vX.Y.Z, where X.Y.Z is the
#           version of moon.mod, on a commit of main, when vX.Y.Z has no GitHub release yet and
#           CHANGELOG.md has its section (scripts/release.mbtx).
# checks    runs every job of the CI workflow on the candidate commit.
# package   checks the publication policy, packages moonrockz/extism, audits the archive (licenses,
#           vendored WAMR and SIMDe, kernel bytes, no tooling or tests) and records its SHA-256.
# publish   publishes moonrockz/extism to mooncakes.io, then verifies that the public archive has
#           the SHA-256 that the package job approved.
# release   creates the GitHub release vX.Y.Z with the CHANGELOG.md section.
#
# A pull request that changes a release file, and a manual run with dry_run, only plan, check and
# package; a pull request skips the checks job, because the CI workflow runs on it. A repeated
# publication must pass the public archive checksum gate. Existing releases and tags are never
# replaced, and no job pushes a tag.

name: Release

on:
  push:
    tags: ['v*']
    branches: [DamianReeves/extism-host]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/workflows/ci.yml
      - scripts/release.mbtx
      - scripts/package.mbtx
      - scripts/publish.mbtx
      - scripts/credentials.mbtx
      - moon.mod
      - pkgs/extism/moon.mod
      - pkgs/extism/LICENSE
      - CHANGELOG.md
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run every check and package the module, but do not publish or create a release
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('release-pr-{0}', github.event.number) || 'release' }}
  cancel-in-progress: false

env:
  MISE_EXPERIMENTAL: 'true'
  # The mise release that installs the pinned tools, as in the CI workflow.
  MISE_VERSION: v2026.10.20

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release: ${{ steps.plan.outputs.release }}
      dry_run: ${{ steps.plan.outputs.dry_run }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Decide what this run does
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ (inputs.dry_run == true || github.ref_type == 'branch') && 'true' || 'false' }}
        run: mise run release:plan

  checks:
    name: Checks
    needs: [plan]
    if: >-
      needs.plan.outputs.release == 'true' ||
      (needs.plan.outputs.dry_run == 'true' && github.event_name != 'pull_request')
    uses: ./.github/workflows/ci.yml

  package:
    name: Package
    runs-on: ubuntu-latest
    needs: [plan, checks]
    # A pull request skips the checks job; any other run needs it to succeed.
    if: >-
      always() && needs.plan.result == 'success' &&
      (needs.plan.outputs.release == 'true' || needs.plan.outputs.dry_run == 'true') &&
      (needs.checks.result == 'success' ||
       (needs.checks.result == 'skipped' && github.event_name == 'pull_request'))
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the publication policy
        run: mise run release:policy
      - name: Package and audit the module and record its checksum
        run: mise run release:package
      - name: Retain the approved archive and its checksum
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-package
          path: |
            _build/publish/checksums.json
            _build/publish/moonrockz-extism-${{ needs.plan.outputs.version }}.zip
          if-no-files-found: error

  publish:
    name: Publish to mooncakes.io
    runs-on: ubuntu-latest
    needs: [plan, checks, package]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Download the approved checksum
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-package
          path: _build/publish
      - name: Write the mooncakes.io credentials
        env:
          MOONCAKES_USER_TOKEN: ${{ secrets.MOONCAKES_USER_TOKEN }}
        run: mise run release:credentials
      - name: Publish the module
        run: mise run release:publish
      - name: Verify the public archive against the approved checksum
        run: mise run check:published

  release:
    name: GitHub release
    runs-on: ubuntu-latest
    needs: [plan, publish]
    if: needs.plan.outputs.release == 'true'
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Write the release notes
        run: mise run release:notes ${{ needs.plan.outputs.version }} > "$RUNNER_TEMP/notes.md"
      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: mise run release:github "$VERSION" "$RUNNER_TEMP/notes.md"
