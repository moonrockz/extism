name: Windows MSVC

# The native engine on Windows x64 with MSVC: a fresh consumer of moonrockz/extism compiles the
# vendored WAMR source with cl.exe and links it, and the engine tests run. It runs on request only,
# for example for a release candidate.
on:
  workflow_dispatch:
  # Temporary: one run on the implementation branch, because workflow_dispatch needs the workflow on
  # the default branch. The next commit removes this trigger.
  push:
    branches: [DamianReeves/extism-host]

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: 'true'
  # The mise release that installs the pinned tools. The setup action reads it.
  MISE_VERSION: v2026.10.20

jobs:
  windows-msvc:
    name: Engine (Windows x64, MSVC)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Set up the MSVC developer environment
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64
      - name: Install pinned tools
        uses: ./.github/actions/setup
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and run a fresh consumer
        run: mise run check:consumer -- native
      - name: Test the engine
        run: mise run test -- native
